apiVersion: apps/v1
kind: Deployment
metadata:
  name: privileged-webapp
  namespace: default
  labels:
    app: vulnerable-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-webapp
  template:
    metadata:
      labels:
        app: vulnerable-webapp
    spec:
      hostPID: true
      hostNetwork: true
      serviceAccountName: cluster-admin-sa
      automountServiceAccountToken: true
      containers:
      - name: webapp-container
        image: nginx:latest
        securityContext:
          privileged: true
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
        volumeMounts:
        - mountPath: /var/run/docker.sock
          name: docker-socket
        - mountPath: /host-root
          name: host-root
      volumes:
      - name: docker-socket
        hostPath:
          path: /var/run/docker.sock
      - name: host-root
        hostPath:
          path: /
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dangerous-cluster-admin-binding
subjects:
- kind: ServiceAccount
  name: cluster-admin-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-admin-sa
  namespace: default
